<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTrack - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .mobile-container { width: 100%; max-width: 400px; height: 100vh; max-height: 850px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="accesibilidad.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Contenedor del Móvil -->
    <div class="mobile-container bg-white shadow-2xl relative flex flex-col sm:rounded-[2.5rem] sm:h-[800px] sm:border-[8px] sm:border-gray-900 overflow-hidden">
        
        <!-- Header (Barra de estado y Buscador) -->
        <div class="bg-white pt-5 pb-2 px-4 z-10">
            <!-- Barra de estado -->
            <div class="flex justify-between items-center mb-4 text-sm font-bold">
                <span>9:41</span>
                <div class="flex space-x-2 items-center">
                    <i class="fa-solid fa-signal text-xs"></i>
                    <i class="fa-solid fa-wifi text-xs"></i>
                    <i class="fa-solid fa-battery-full text-lg"></i>
                </div>
            </div>

            <!-- Buscador Funcional -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-500"></i>
                <input id="buscador-inicio" type="text" oninput="buscarEnInicio()" placeholder="Buscar libros, autores o géneros" 
                       class="w-full bg-gray-100 text-gray-900 rounded-xl py-2.5 pl-11 pr-10 focus:outline-none focus:ring-2 focus:ring-gray-300 font-medium text-sm">
                <button id="btn-limpiar-busqueda" onclick="limpiarBusqueda()" type="button" aria-label="Limpiar búsqueda"
                        class="hidden absolute right-3.5 top-2.5 text-gray-400 hover:text-gray-700 p-0.5">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
        </div>

        <!-- Contenido Central (Scrolleable) -->
        <div class="flex-1 overflow-y-auto no-scrollbar pb-24">
            
            <!-- VISTA DE RESULTADOS DE BÚSQUEDA (Oculta por defecto) -->
            <div id="resultados-busqueda" class="hidden px-4 pt-3"></div>

            <!-- BARRA DE CHIPS SUPERIORES (Siempre visible salvo al buscar) -->
            <div id="barra-chips" class="carrusel-horizontal flex overflow-x-auto no-scrollbar px-4 py-3 space-x-3 cursor-grab select-none">
                <button id="chip-favoritos" onclick="toggleFiltroSuperior('favoritos')" type="button"
                        class="chip-filtro flex items-center space-x-2 px-3 py-1.5 border border-gray-200 rounded-lg whitespace-nowrap transition-colors flex-shrink-0">
                    <i class="fa-regular fa-heart"></i>
                    <span class="text-sm font-semibold">Favoritos</span>
                </button>
                <button id="chip-historial" onclick="toggleFiltroSuperior('historial')" type="button"
                        class="chip-filtro flex items-center space-x-2 px-3 py-1.5 border border-gray-200 rounded-lg whitespace-nowrap transition-colors flex-shrink-0">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span class="text-sm font-semibold">Historial</span>
                </button>
                <button id="chip-pedidos" onclick="toggleFiltroSuperior('pedidos')" type="button"
                        class="chip-filtro flex items-center space-x-2 px-3 py-1.5 border border-gray-200 rounded-lg whitespace-nowrap transition-colors flex-shrink-0">
                    <i class="fa-regular fa-file-lines"></i>
                    <span class="text-sm font-semibold">Pedidos</span>
                </button>
                <button id="chip-seguidos" onclick="toggleFiltroSuperior('seguidos')" type="button"
                        class="chip-filtro flex items-center space-x-2 px-3 py-1.5 border border-gray-200 rounded-lg whitespace-nowrap transition-colors flex-shrink-0">
                    <i class="fa-solid fa-user-check"></i>
                    <span class="text-sm font-semibold">Seguidos</span>
                </button>
                <div class="w-1 flex-shrink-0"></div>
            </div>

            <!-- VISTA DEL FILTRO SUPERIOR ACTIVO (Favoritos / Historial / Pedidos / Seguidos) -->
            <div id="vista-filtro-superior" class="hidden px-4 pt-1"></div>

            <!-- VISTA PRINCIPAL DE INICIO -->
            <div id="contenido-inicio">
                <!-- Banner Promocional -->
                <div class="px-4 mb-6">
                    <img src="img/alas_sangre.jpg" alt="Alas de Sangre" class="w-full h-24 object-cover rounded-xl shadow-sm bg-yellow-200" onerror="this.src='https://via.placeholder.com/400x120/FCD34D/000000?text=ALAS+DE+SANGRE'">
                </div>

                <!-- Sección: Autores -->
                <div class="mb-6">
                    <div class="px-4 flex items-center mb-3">
                        <a href="autores.html?from=inicio" class="flex items-center text-lg font-bold text-gray-900 hover:text-gray-600">
                            Autores <i class="fa-solid fa-chevron-right text-sm ml-2"></i>
                        </a>
                    </div>
                    <div class="carrusel-horizontal flex overflow-x-auto no-scrollbar px-4 space-x-4 cursor-grab select-none">
                        <!-- Autor 1 -->
                        <a href="autor.html?id=george" class="flex flex-col items-center min-w-[76px] w-[76px] flex-shrink-0">
                            <img src="img/george.jpg" class="w-[72px] h-[72px] rounded-full object-cover border border-gray-100 shadow-sm" alt="George R.R. Martin">
                            <span class="text-xs text-center font-semibold text-gray-900 mt-2 leading-tight">George<br>R.R. Martin</span>
                        </a>
                        
                        <!-- Autor 2 -->
                        <a href="autor.html?id=suzanne" class="flex flex-col items-center min-w-[76px] w-[76px] flex-shrink-0">
                            <img src="img/suzanne.jpg" class="w-[72px] h-[72px] rounded-full object-cover border border-gray-100 shadow-sm" alt="Suzanne Collins">
                            <span class="text-xs text-center font-semibold text-gray-900 mt-2 leading-tight">Suzanne<br>Collins</span>
                        </a>
                        
                        <!-- Autor 3 -->
                        <a href="autor.html?id=brandon" class="flex flex-col items-center min-w-[76px] w-[76px] flex-shrink-0">
                            <img src="img/brandon.jpg" class="w-[72px] h-[72px] rounded-full object-cover border border-gray-100 shadow-sm" alt="Brandon Sanderson">
                            <span class="text-xs text-center font-semibold text-gray-900 mt-2 leading-tight">Brandon<br>Sanderson</span>
                        </a>
                        
                        <!-- Autor 4 -->
                        <a href="autor.html?id=cassandra" class="flex flex-col items-center min-w-[76px] w-[76px] flex-shrink-0">
                            <img src="img/cassandra.jpg" class="w-[72px] h-[72px] rounded-full object-cover border border-gray-100 shadow-sm" alt="Cassandra Clare">
                            <span class="text-xs text-center font-semibold text-gray-900 mt-2 leading-tight">Cassandra<br>Clare</span>
                        </a>

                        <div class="w-1 flex-shrink-0"></div>
                    </div>
                </div>

                <!-- Sección: Títulos Populares -->
                <div>
                    <div class="px-4 flex items-center mb-4">
                        <a href="populares.html" class="flex items-center text-lg font-bold text-gray-900 hover:text-gray-600">
                            Títulos populares <i class="fa-solid fa-chevron-right text-sm ml-2"></i>
                        </a>
                    </div>
                    
                    <div class="carrusel-horizontal flex overflow-x-auto no-scrollbar px-4 space-x-4 pb-4 cursor-grab select-none">
                        <!-- Libro 1 -->
                        <a href="libro.html?id=juego_tronos" class="flex flex-col min-w-[120px] w-[120px] flex-shrink-0">
                            <img src="img/juego_tronos.jpg" class="w-full h-44 object-cover rounded-md shadow-md mb-2" alt="Juego de Tronos">
                            <p class="text-[11px] text-gray-500 font-medium truncate">George R.R. Martin</p>
                            <h3 class="text-sm font-bold text-gray-900 leading-snug">Juego de<br>Tronos</h3>
                            <p class="text-sm font-bold text-gray-900 mt-1">16.50 €</p>
                        </a>

                        <!-- Libro 2 -->
                        <a href="libro.html?id=juegos_hambre" class="flex flex-col min-w-[120px] w-[120px] flex-shrink-0">
                            <img src="img/juegos_hambre.jpg" class="w-full h-44 object-cover rounded-md shadow-md mb-2" alt="Los Juegos del Hambre">
                            <p class="text-[11px] text-gray-500 font-medium truncate">Suzanne Collins</p>
                            <h3 class="text-sm font-bold text-gray-900 leading-snug">Los juegos del<br>Hambre</h3>
                            <p class="text-sm font-bold text-gray-900 mt-1">13.80 €</p>
                        </a>

                        <!-- Libro 3 -->
                        <a href="libro.html?id=nacidos_bruma" class="flex flex-col min-w-[120px] w-[120px] flex-shrink-0">
                            <img src="img/nacidos_bruma.jpg" class="w-full h-44 object-cover rounded-md shadow-md mb-2" alt="Nacidos de la Bruma">
                            <p class="text-[11px] text-gray-500 font-medium truncate">Brandon San...</p>
                            <h3 class="text-sm font-bold text-gray-900 leading-snug">Nacidos de la<br>Bruma</h3>
                            <p class="text-sm font-bold text-gray-900 mt-1">12,00 €</p>
                        </a>

                        <!-- Libro 4 -->
                        <a href="libro.html?id=ciudad_hueso" class="flex flex-col min-w-[120px] w-[120px] flex-shrink-0">
                            <img src="img/ciudad_hueso.jpg" class="w-full h-44 object-cover rounded-md shadow-md mb-2" alt="La Ciudad de los Huesos">
                            <p class="text-[11px] text-gray-500 font-medium truncate">Cassandra Clare</p>
                            <h3 class="text-sm font-bold text-gray-900 leading-snug">La Ciudad de los<br>Huesos</h3>
                            <p class="text-sm font-bold text-gray-900 mt-1">15,00 €</p>
                        </a>

                        <div class="w-1 flex-shrink-0"></div>
                    </div>
                </div>
            </div>
            
        </div>

        <!-- Barra de Navegación Inferior -->
        <div class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex flex-col z-20">
            <div class="flex justify-between items-center px-6 py-3">
                <a href="inicio.html" class="text-black text-2xl flex flex-col items-center">
                    <i class="fa-solid fa-house"></i>
                </a>
                <a href="subastas.html" class="text-gray-800 text-2xl flex flex-col items-center active:text-black">
                    <i class="fa-solid fa-gavel"></i>
                </a>
                <a href="escaner.html" class="text-gray-800 text-3xl flex flex-col items-center active:text-black">
                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24">
                        <path d="M4 4h4v2H6v2H4V4zm16 0h-4v2h2v2h2V4zM4 20h4v-2H6v-2H4v4zm16 0h-4v-2h2v-2h2v4zM7 7h10v10H7V7zm2 2v6h6V9H9z"/>
                    </svg>
                </a>
                <a href="carrito.html" class="text-gray-800 text-2xl flex flex-col items-center active:text-black">
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
                <a href="perfil.html" class="text-gray-800 text-2xl flex flex-col items-center active:text-black">
                    <i class="fa-regular fa-user"></i>
                </a>
            </div>
            <div class="w-full flex justify-center pb-2 pt-1">
                <div class="w-32 h-1 bg-black rounded-full"></div>
            </div>
        </div>

    </div>

    <script>
        // --- CATÁLOGO GLOBAL ---
        const catalogoAutores = [
            { id: "george", nombre: "George R.R. Martin", genero: "Fantasía épica", img: "img/george.jpg" },
            { id: "suzanne", nombre: "Suzanne Collins", genero: "Distopía · Literatura juvenil", img: "img/suzanne.jpg" },
            { id: "brandon", nombre: "Brandon Sanderson", genero: "Fantasía épica · Fantasía moderna", img: "img/brandon.jpg" },
            { id: "cassandra", nombre: "Cassandra Clare", genero: "Fantasía urbana · Literatura juvenil", img: "img/cassandra.jpg" }
        ];

        const catalogoLibros = [
            { id: "juego_tronos", titulo: "Juego de Tronos", autor: "George R.R. Martin", genero: "Fantasía épica", precio: "16,50 €", portada: "img/juego_tronos.jpg" },
            { id: "choque_reyes", titulo: "Choque de reyes", autor: "George R.R. Martin", genero: "Fantasía épica", precio: "18,95 €", portada: "img/choque_reyes.jpg" },
            { id: "tormenta_espadas", titulo: "Tormenta de espadas", autor: "George R.R. Martin", genero: "Fantasía épica", precio: "21,95 €", portada: "img/tormenta_espadas.jpg" },
            { id: "festin_cuervos", titulo: "Festín de cuervos", autor: "George R.R. Martin", genero: "Fantasía épica", precio: "19,95 €", portada: "img/festin_cuervos.jpg" },
            { id: "juegos_hambre", titulo: "Los juegos del Hambre", autor: "Suzanne Collins", genero: "Distopía", precio: "13,80 €", portada: "img/juegos_hambre.jpg" },
            { id: "en_llamas", titulo: "En llamas", autor: "Suzanne Collins", genero: "Distopía", precio: "14,50 €", portada: "img/en_llamas.jpg" },
            { id: "nacidos_bruma", titulo: "Nacidos de la Bruma", autor: "Brandon Sanderson", genero: "Fantasía épica", precio: "12,00 €", portada: "img/nacidos_bruma.jpg" },
            { id: "ciudad_hueso", titulo: "La Ciudad de los Huesos", autor: "Cassandra Clare", genero: "Fantasía urbana", precio: "15,00 €", portada: "img/ciudad_hueso.jpg" },
            { id: "ciudad_ceniza", titulo: "Ciudad de Ceniza", autor: "Cassandra Clare", genero: "Fantasía urbana", precio: "16,00 €", portada: "img/ciudad_ceniza.jpg" }
        ];

        // --- DATOS PERSISTENTES (FAVORITOS, HISTORIAL, PEDIDOS, SEGUIDOS) ---
        if (localStorage.getItem('bibliotrack_favoritos') === null) {
            localStorage.setItem('bibliotrack_favoritos', JSON.stringify(['juego_tronos', 'nacidos_bruma']));
        }
        if (localStorage.getItem('bibliotrack_historial') === null) {
            localStorage.setItem('bibliotrack_historial', JSON.stringify([
                { id: 'juego_tronos', fecha: 'Visto hoy' },
                { id: 'juegos_hambre', fecha: 'Visto ayer' },
                { id: 'ciudad_hueso', fecha: 'Hace 3 días' }
            ]));
        }
        if (localStorage.getItem('bibliotrack_seguidos') === null) {
            localStorage.setItem('bibliotrack_seguidos', JSON.stringify(['george', 'brandon']));
        }

        const pedidosDemo = [
            {
                codigo: "#BT-2048",
                libroId: "juego_tronos",
                tipo: "Compra",
                estado: "Entregado",
                badgeClase: "bg-emerald-50 text-emerald-700 border-emerald-200",
                fecha: "10 nov 2026",
                importe: "16,50 €"
            },
            {
                codigo: "#BT-2041",
                libroId: "nacidos_bruma",
                tipo: "Alquiler (15 días)",
                estado: "En curso · Quedan 6 días",
                badgeClase: "bg-amber-50 text-amber-700 border-amber-200",
                fecha: "05 nov 2026",
                importe: "4,50 €"
            },
            {
                codigo: "#BT-2019",
                libroId: "juegos_hambre",
                tipo: "Compra",
                estado: "Entregado",
                badgeClase: "bg-emerald-50 text-emerald-700 border-emerald-200",
                fecha: "24 oct 2026",
                importe: "13,80 €"
            }
        ];

        let filtroActivo = null;

        function obtenerLibro(id) {
            return catalogoLibros.find(l => l.id === id);
        }

        function obtenerAutor(id) {
            return catalogoAutores.find(a => a.id === id);
        }

        // --- CONTROL DE LOS BOTONES SUPERIORES ---
        function toggleFiltroSuperior(tipo) {
            if (filtroActivo === tipo) {
                cerrarFiltroSuperior();
                return;
            }
            filtroActivo = tipo;
            actualizarEstilosChips();
            renderizarFiltroSuperior();
        }

        function cerrarFiltroSuperior() {
            filtroActivo = null;
            actualizarEstilosChips();
            document.getElementById('vista-filtro-superior').classList.add('hidden');
            document.getElementById('contenido-inicio').classList.remove('hidden');
        }

        function actualizarEstilosChips() {
            document.querySelectorAll('.chip-filtro').forEach(btn => {
                btn.classList.remove('bg-gray-900', 'text-white', 'border-gray-900');
                btn.classList.add('border-gray-200', 'text-gray-900');
            });

            const iconoFav = document.querySelector('#chip-favoritos i');
            if (iconoFav) {
                iconoFav.className = (filtroActivo === 'favoritos') ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
            }

            if (filtroActivo) {
                const chipActivo = document.getElementById('chip-' + filtroActivo);
                if (chipActivo) {
                    chipActivo.classList.remove('border-gray-200', 'text-gray-900');
                    chipActivo.classList.add('bg-gray-900', 'text-white', 'border-gray-900');
                }
            }
        }

        function quitarFavorito(id) {
            let favs = JSON.parse(localStorage.getItem('bibliotrack_favoritos') || '[]');
            favs = favs.filter(item => item !== id);
            localStorage.setItem('bibliotrack_favoritos', JSON.stringify(favs));
            renderizarFiltroSuperior();
        }

        function limpiarHistorial() {
            localStorage.setItem('bibliotrack_historial', JSON.stringify([]));
            renderizarFiltroSuperior();
        }

        function dejarDeSeguir(id) {
            let seguidos = JSON.parse(localStorage.getItem('bibliotrack_seguidos') || '[]');
            seguidos = seguidos.filter(item => item !== id);
            localStorage.setItem('bibliotrack_seguidos', JSON.stringify(seguidos));
            renderizarFiltroSuperior();
        }

        function renderizarFiltroSuperior() {
            const vista = document.getElementById('vista-filtro-superior');
            const inicio = document.getElementById('contenido-inicio');

            inicio.classList.add('hidden');
            vista.classList.remove('hidden');

            if (filtroActivo === 'favoritos') {
                const favIds = JSON.parse(localStorage.getItem('bibliotrack_favoritos') || '[]');
                const librosFav = favIds.map(obtenerLibro).filter(Boolean);

                let html = `
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-gray-900">Tus favoritos</h2>
                            <p class="text-xs text-gray-500">${librosFav.length} ${librosFav.length === 1 ? 'libro guardado' : 'libros guardados'}</p>
                        </div>
                        <button onclick="cerrarFiltroSuperior()" class="text-xs font-semibold text-gray-500 hover:text-gray-900 px-2.5 py-1 rounded-lg bg-gray-100">
                            Cerrar <i class="fa-solid fa-xmark ml-1"></i>
                        </button>
                    </div>
                `;

                if (librosFav.length === 0) {
                    html += `
                        <div class="text-center py-12 px-4 bg-gray-50 rounded-2xl">
                            <i class="fa-regular fa-heart text-3xl text-gray-300 mb-3"></i>
                            <p class="text-sm font-bold text-gray-900 mb-1">Aún no tienes favoritos</p>
                            <p class="text-xs text-gray-500 mb-4">Pulsa el icono del corazón en la ficha de cualquier libro para guardarlo aquí.</p>
                            <button onclick="cerrarFiltroSuperior()" class="px-4 py-2 bg-black text-white text-xs font-bold rounded-lg">Explorar libros</button>
                        </div>
                    `;
                } else {
                    html += `<div class="flex flex-col space-y-3">`;
                    librosFav.forEach(l => {
                        html += `
                            <div class="flex items-center space-x-3 p-2.5 border border-gray-100 rounded-xl bg-white shadow-sm">
                                <a href="libro.html?id=${l.id}" class="flex-shrink-0">
                                    <img src="${l.portada}" class="w-14 h-20 object-cover rounded shadow-sm" alt="${l.titulo}" onerror="this.src='https://via.placeholder.com/56x80/E5E7EB/9CA3AF'">
                                </a>
                                <a href="libro.html?id=${l.id}" class="flex-1 min-w-0">
                                    <p class="text-xs text-gray-500 truncate">${l.autor}</p>
                                    <h3 class="text-sm font-bold text-gray-900 truncate">${l.titulo}</h3>
                                    <p class="text-sm font-bold text-gray-900 mt-1">${l.precio}</p>
                                </a>
                                <button onclick="quitarFavorito('${l.id}')" title="Quitar de favoritos" class="w-9 h-9 rounded-lg border border-gray-200 flex items-center justify-center text-gray-900 hover:bg-gray-50 active:scale-95">
                                    <i class="fa-solid fa-heart"></i>
                                </button>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                vista.innerHTML = html;

            } else if (filtroActivo === 'historial') {
                const historial = JSON.parse(localStorage.getItem('bibliotrack_historial') || '[]');
                const items = historial.map(h => ({ ...h, libro: obtenerLibro(h.id) })).filter(h => h.libro);

                let html = `
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-gray-900">Historial reciente</h2>
                            <p class="text-xs text-gray-500">Últimos libros consultados</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${items.length > 0 ? `<button onclick="limpiarHistorial()" class="text-xs font-semibold text-gray-500 hover:text-gray-900 px-2 py-1">Borrar</button>` : ''}
                            <button onclick="cerrarFiltroSuperior()" class="text-xs font-semibold text-gray-500 hover:text-gray-900 px-2.5 py-1 rounded-lg bg-gray-100">
                                Cerrar <i class="fa-solid fa-xmark ml-1"></i>
                            </button>
                        </div>
                    </div>
                `;

                if (items.length === 0) {
                    html += `
                        <div class="text-center py-12 px-4 bg-gray-50 rounded-2xl">
                            <i class="fa-solid fa-clock-rotate-left text-3xl text-gray-300 mb-3"></i>
                            <p class="text-sm font-bold text-gray-900 mb-1">Historial vacío</p>
                            <p class="text-xs text-gray-500 mb-4">Aquí aparecerán los libros cuya ficha vayas visitando.</p>
                            <button onclick="cerrarFiltroSuperior()" class="px-4 py-2 bg-black text-white text-xs font-bold rounded-lg">Volver al catálogo</button>
                        </div>
                    `;
                } else {
                    html += `<div class="flex flex-col space-y-3">`;
                    items.forEach(item => {
                        html += `
                            <a href="libro.html?id=${item.libro.id}" class="flex items-center space-x-3.5 p-2.5 border border-gray-100 rounded-xl hover:bg-gray-50 transition-colors">
                                <img src="${item.libro.portada}" class="w-12 h-18 object-cover rounded shadow-sm flex-shrink-0" alt="${item.libro.titulo}" onerror="this.src='https://via.placeholder.com/48x72/E5E7EB/9CA3AF'">
                                <div class="flex-1 min-w-0">
                                    <span class="inline-block text-[10px] font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded mb-1">${item.fecha}</span>
                                    <h3 class="text-sm font-bold text-gray-900 truncate">${item.libro.titulo}</h3>
                                    <p class="text-xs text-gray-500 truncate">${item.libro.autor} · <span class="font-bold text-gray-900">${item.libro.precio}</span></p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                            </a>
                        `;
                    });
                    html += `</div>`;
                }
                vista.innerHTML = html;

            } else if (filtroActivo === 'pedidos') {
                let html = `
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-gray-900">Tus pedidos y alquileres</h2>
                            <p class="text-xs text-gray-500">${pedidosDemo.length} operaciones registradas</p>
                        </div>
                        <button onclick="cerrarFiltroSuperior()" class="text-xs font-semibold text-gray-500 hover:text-gray-900 px-2.5 py-1 rounded-lg bg-gray-100">
                            Cerrar <i class="fa-solid fa-xmark ml-1"></i>
                        </button>
                    </div>
                    <div class="flex flex-col space-y-3">
                `;

                pedidosDemo.forEach(p => {
                    const libro = obtenerLibro(p.libroId);
                    if (!libro) return;
                    html += `
                        <a href="libro.html?id=${libro.id}" class="block p-3.5 border border-gray-200 rounded-xl bg-white hover:bg-gray-50 transition-colors">
                            <div class="flex justify-between items-center mb-2.5">
                                <span class="text-xs font-bold text-gray-900">Pedido ${p.codigo}</span>
                                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full border ${p.badgeClase}">${p.estado}</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <img src="${libro.portada}" class="w-12 h-16 object-cover rounded shadow-sm flex-shrink-0" alt="${libro.titulo}">
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-bold text-gray-900 truncate">${libro.titulo}</p>
                                    <p class="text-xs text-gray-500">${p.tipo} · ${p.fecha}</p>
                                    <p class="text-sm font-bold text-gray-900 mt-1">${p.importe}</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                            </div>
                        </a>
                    `;
                });

                html += `</div>`;
                vista.innerHTML = html;

            } else if (filtroActivo === 'seguidos') {
                const seguidosIds = JSON.parse(localStorage.getItem('bibliotrack_seguidos') || '[]');
                const autoresSeguidos = seguidosIds.map(obtenerAutor).filter(Boolean);

                let html = `
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-gray-900">Autores seguidos</h2>
                            <p class="text-xs text-gray-500">${autoresSeguidos.length} ${autoresSeguidos.length === 1 ? 'autor seguido' : 'autores seguidos'}</p>
                        </div>
                        <button onclick="cerrarFiltroSuperior()" class="text-xs font-semibold text-gray-500 hover:text-gray-900 px-2.5 py-1 rounded-lg bg-gray-100">
                            Cerrar <i class="fa-solid fa-xmark ml-1"></i>
                        </button>
                    </div>
                `;

                if (autoresSeguidos.length === 0) {
                    html += `
                        <div class="text-center py-12 px-4 bg-gray-50 rounded-2xl">
                            <i class="fa-solid fa-user-check text-3xl text-gray-300 mb-3"></i>
                            <p class="text-sm font-bold text-gray-900 mb-1">No sigues a ningún autor</p>
                            <p class="text-xs text-gray-500 mb-4">Explora la lista de autores para seguir tus favoritos.</p>
                            <a href="autores.html?from=inicio" class="inline-block px-4 py-2 bg-black text-white text-xs font-bold rounded-lg">Ver autores</a>
                        </div>
                    `;
                } else {
                    html += `<div class="flex flex-col space-y-3">`;
                    autoresSeguidos.forEach(a => {
                        html += `
                            <div class="flex items-center justify-between p-2.5 border border-gray-100 rounded-xl bg-white shadow-sm">
                                <a href="autor.html?id=${a.id}" class="flex items-center space-x-3 flex-1 min-w-0">
                                    <img src="${a.img}" class="w-12 h-12 rounded-full object-cover border border-gray-200 flex-shrink-0" alt="${a.nombre}">
                                    <div class="min-w-0">
                                        <p class="text-sm font-bold text-gray-900 truncate">${a.nombre}</p>
                                        <p class="text-xs text-gray-500 truncate">${a.genero}</p>
                                    </div>
                                </a>
                                <button onclick="dejarDeSeguir('${a.id}')" class="ml-2 px-3 py-1.5 text-xs font-semibold border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50">
                                    Siguiendo
                                </button>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                vista.innerHTML = html;
            }
        }

        // --- BUSCADOR GLOBAL ---
        function normalizar(texto) {
            return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function buscarEnInicio() {
            const input = document.getElementById('buscador-inicio');
            const consulta = normalizar(input.value.trim());
            const contenidoInicio = document.getElementById('contenido-inicio');
            const barraChips = document.getElementById('barra-chips');
            const vistaFiltro = document.getElementById('vista-filtro-superior');
            const contenedorResultados = document.getElementById('resultados-busqueda');
            const btnLimpiar = document.getElementById('btn-limpiar-busqueda');

            if (!consulta) {
                barraChips.classList.remove('hidden');
                contenedorResultados.classList.add('hidden');
                btnLimpiar.classList.add('hidden');
                if (filtroActivo) {
                    vistaFiltro.classList.remove('hidden');
                    contenidoInicio.classList.add('hidden');
                } else {
                    vistaFiltro.classList.add('hidden');
                    contenidoInicio.classList.remove('hidden');
                }
                return;
            }

            btnLimpiar.classList.remove('hidden');
            barraChips.classList.add('hidden');
            vistaFiltro.classList.add('hidden');
            contenidoInicio.classList.add('hidden');
            contenedorResultados.classList.remove('hidden');

            const autoresFiltrados = catalogoAutores.filter(a =>
                normalizar(a.nombre).includes(consulta) || normalizar(a.genero).includes(consulta)
            );

            const librosFiltrados = catalogoLibros.filter(l =>
                normalizar(l.titulo).includes(consulta) ||
                normalizar(l.autor).includes(consulta) ||
                normalizar(l.genero).includes(consulta)
            );

            if (autoresFiltrados.length === 0 && librosFiltrados.length === 0) {
                contenedorResultados.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-center py-14 px-4">
                        <i class="fa-solid fa-magnifying-glass text-3xl text-gray-300 mb-3"></i>
                        <p class="text-base font-bold text-gray-900 mb-1">Sin resultados</p>
                        <p class="text-xs text-gray-500 mb-4">No hemos encontrado libros ni autores para "${input.value}".</p>
                        <button onclick="limpiarBusqueda()" class="px-4 py-2 bg-gray-900 text-white text-xs font-bold rounded-lg">
                            Volver a explorar
                        </button>
                    </div>
                `;
                return;
            }

            let html = "";

            if (autoresFiltrados.length > 0) {
                html += `<h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">Autores (${autoresFiltrados.length})</h3>`;
                html += `<div class="flex flex-col space-y-2 mb-6">`;
                autoresFiltrados.forEach(a => {
                    html += `
                        <a href="autor.html?id=${a.id}" class="flex items-center justify-between p-2 rounded-xl hover:bg-gray-50 active:bg-gray-100">
                            <div class="flex items-center space-x-3">
                                <img src="${a.img}" class="w-12 h-12 rounded-full object-cover border border-gray-200" alt="${a.nombre}">
                                <div>
                                    <p class="text-sm font-bold text-gray-900">${a.nombre}</p>
                                    <p class="text-xs text-gray-500">${a.genero}</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                        </a>
                    `;
                });
                html += `</div>`;
            }

            if (librosFiltrados.length > 0) {
                html += `<h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">Libros (${librosFiltrados.length})</h3>`;
                html += `<div class="flex flex-col space-y-3">`;
                librosFiltrados.forEach(l => {
                    html += `
                        <a href="libro.html?id=${l.id}" class="flex items-center space-x-3.5 p-2 rounded-xl hover:bg-gray-50 active:bg-gray-100">
                            <img src="${l.portada}" class="w-12 h-18 object-cover rounded shadow-sm flex-shrink-0" alt="${l.titulo}" onerror="this.src='https://via.placeholder.com/48x72/E5E7EB/9CA3AF'">
                            <div class="flex-1 min-w-0">
                                <p class="text-xs text-gray-500 truncate">${l.autor}</p>
                                <p class="text-sm font-bold text-gray-900 truncate">${l.titulo}</p>
                                <p class="text-sm font-bold text-gray-900 mt-0.5">${l.precio}</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                        </a>
                    `;
                });
                html += `</div>`;
            }

            contenedorResultados.innerHTML = html;
        }

        function limpiarBusqueda() {
            const input = document.getElementById('buscador-inicio');
            input.value = "";
            buscarEnInicio();
            input.focus();
        }

        // --- DESPLAZAMIENTO HORIZONTAL FLUIDO CON RATÓN Y RUEDA ---
        document.querySelectorAll('.carrusel-horizontal').forEach(slider => {
            let isDown = false;
            let startX;
            let scrollLeft;
            let moved = false;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                moved = false;
                slider.classList.add('cursor-grabbing');
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });

            slider.addEventListener('mouseleave', () => {
                isDown = false;
                slider.classList.remove('cursor-grabbing');
            });

            slider.addEventListener('mouseup', () => {
                isDown = false;
                slider.classList.remove('cursor-grabbing');
            });

            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.5;
                if (Math.abs(walk) > 5) moved = true;
                slider.scrollLeft = scrollLeft - walk;
            });

            slider.querySelectorAll('a, button').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (moved) e.preventDefault();
                });
                el.addEventListener('dragstart', (e) => e.preventDefault());
            });

            slider.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    slider.scrollLeft += e.deltaY;
                }
            }, { passive: false });
        });

        // Abrir filtro directamente si viene en la URL (ej. inicio.html?filtro=favoritos)
        const filtroUrl = new URLSearchParams(window.location.search).get('filtro');
        if (['favoritos', 'historial', 'pedidos', 'seguidos'].includes(filtroUrl)) {
            toggleFiltroSuperior(filtroUrl);
            window.history.replaceState(null, '', 'inicio.html');
        }
    </script>

</body>
