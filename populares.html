<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTrack - Títulos populares</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .mobile-container { width: 100%; max-width: 400px; height: 100vh; max-height: 850px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="accesibilidad.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="mobile-container bg-white shadow-2xl relative flex flex-col sm:rounded-[2.5rem] sm:h-[800px] sm:border-[8px] sm:border-gray-900 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-white pt-5 pb-2 px-4 z-10 sticky top-0">
            <div class="flex justify-between items-center mb-4 text-sm font-bold">
                <span>9:41</span>
                <div class="flex space-x-2 items-center">
                    <i class="fa-solid fa-signal text-xs"></i>
                    <i class="fa-solid fa-wifi text-xs"></i>
                    <i class="fa-solid fa-battery-full text-lg"></i>
                </div>
            </div>

            <!-- Navegación Superior -->
            <div class="flex items-center relative py-2">
                <button onclick="window.history.back()" class="absolute left-0 text-gray-900 text-xl px-2 active:scale-95 transition-transform">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h1 class="w-full text-center text-lg font-bold text-gray-900">Títulos populares</h1>
            </div>
        </div>

        <!-- Contenido Central -->
        <div class="flex-1 overflow-y-auto no-scrollbar pb-24 px-4 pt-2">
            
            <!-- Buscador -->
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                <input id="input-busqueda" type="text" oninput="renderizarLibros()" placeholder="Buscar título o autor" class="w-full bg-gray-100 text-gray-900 rounded-xl py-2.5 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-gray-300 text-sm font-medium">
            </div>

            <!-- Cabecera de resultados y botón de ordenar -->
            <div class="flex justify-between items-center mb-4">
                <span id="contador-titulos" class="text-sm text-gray-500 font-medium">9 títulos</span>
                
                <button onclick="cambiarOrden()" class="flex items-center space-x-1.5 border border-gray-200 px-3 py-1.5 rounded-lg text-sm font-semibold text-gray-900 hover:bg-gray-50 active:bg-gray-100 transition-colors">
                    <i id="icono-orden" class="fa-solid fa-list text-xs"></i>
                    <span id="texto-orden">Más populares</span>
                </button>
            </div>

            <!-- Lista de Libros (Se rellena con JavaScript) -->
            <div id="lista-populares" class="flex flex-col space-y-6">
                <!-- Los títulos aparecen aquí dinámicamente -->
            </div>
            
        </div>

        <!-- Barra de Navegación Inferior -->
        <div class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex flex-col z-20">
            <div class="flex justify-between items-center px-6 py-3">
                <a href="inicio.html" class="text-gray-800 hover:text-black text-2xl flex flex-col items-center"><i class="fa-solid fa-house"></i></a>
                <a href="subastas.html" class="text-gray-800 hover:text-black text-2xl flex flex-col items-center"><i class="fa-solid fa-gavel"></i></a>
                <a href="escaner.html" class="text-gray-800 hover:text-black text-3xl flex flex-col items-center">
                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M4 4h4v2H6v2H4V4zm16 0h-4v2h2v2h2V4zM4 20h4v-2H6v-2H4v4zm16 0h-4v-2h2v-2h2v4zM7 7h10v10H7V7zm2 2v6h6V9H9z"/></svg>
                </a>
                <a href="carrito.html" class="text-gray-800 hover:text-black text-2xl flex flex-col items-center"><i class="fa-solid fa-cart-shopping"></i></a>
                <a href="perfil.html" class="text-gray-800 hover:text-black text-2xl flex flex-col items-center"><i class="fa-regular fa-user"></i></a>
            </div>
            <div class="w-full flex justify-center pb-2 pt-1">
                <div class="w-32 h-1 bg-black rounded-full"></div>
            </div>
        </div>

    </div>

    <!-- Script de lógica dinámica -->
    <script>
        const todosLosLibros = [
            {
                id: "juego_tronos",
                autor: "George R.R. Martin",
                titulo: "Juego de Tronos",
                precioTexto: "16,50 €",
                precioNum: 16.50,
                portada: "img/juego_tronos.jpg",
                popularidad: 100
            },
            {
                id: "juegos_hambre",
                autor: "Suzanne Collins",
                titulo: "Los juegos del Hambre",
                precioTexto: "13,80 €",
                precioNum: 13.80,
                portada: "img/juegos_hambre.jpg",
                popularidad: 95
            },
            {
                id: "nacidos_bruma",
                autor: "Brandon Sanderson",
                titulo: "Nacidos de la Bruma",
                precioTexto: "12,00 €",
                precioNum: 12.00,
                portada: "img/nacidos_bruma.jpg",
                popularidad: 90
            },
            {
                id: "tormenta_espadas",
                autor: "George R.R. Martin",
                titulo: "Tormenta de espadas",
                precioTexto: "21,95 €",
                precioNum: 21.95,
                portada: "img/tormenta_espadas.jpg",
                popularidad: 85
            },
            {
                id: "choque_reyes",
                autor: "George R.R. Martin",
                titulo: "Choque de reyes",
                precioTexto: "18,95 €",
                precioNum: 18.95,
                portada: "img/choque_reyes.jpg",
                popularidad: 80
            },
            {
                id: "en_llamas",
                autor: "Suzanne Collins",
                titulo: "En llamas",
                precioTexto: "14,50 €",
                precioNum: 14.50,
                portada: "img/en_llamas.jpg",
                popularidad: 75
            },
            {
                id: "ciudad_hueso",
                autor: "Cassandra Clare",
                titulo: "Ciudad de Hueso",
                precioTexto: "15,00 €",
                precioNum: 15.00,
                portada: "img/ciudad_hueso.jpg",
                popularidad: 70
            },
            {
                id: "festin_cuervos",
                autor: "George R.R. Martin",
                titulo: "Festín de cuervos",
                precioTexto: "19,95 €",
                precioNum: 19.95,
                portada: "img/festin_cuervos.jpg",
                popularidad: 65
            },
            {
                id: "ciudad_ceniza",
                autor: "Cassandra Clare",
                titulo: "Ciudad de Ceniza",
                precioTexto: "16,00 €",
                precioNum: 16.00,
                portada: "img/ciudad_ceniza.jpg",
                popularidad: 60
            }
        ];

        let ordenActual = 'populares'; // 'populares' | 'alfabetico' | 'precio'

        function renderizarLibros() {
            const contenedor = document.getElementById('lista-populares');
            const textoBusqueda = document.getElementById('input-busqueda').value.toLowerCase().trim();
            contenedor.innerHTML = "";

            // Filtrar por título o autor si se escribe en el buscador
            let filtrados = todosLosLibros.filter(libro =>
                libro.titulo.toLowerCase().includes(textoBusqueda) ||
                libro.autor.toLowerCase().includes(textoBusqueda)
            );

            // Ordenar según el criterio seleccionado
            if (ordenActual === 'populares') {
                filtrados.sort((a, b) => b.popularidad - a.popularidad);
                document.getElementById('texto-orden').innerText = "Más populares";
                document.getElementById('icono-orden').className = "fa-solid fa-list text-xs";
            } else if (ordenActual === 'alfabetico') {
                filtrados.sort((a, b) => a.titulo.localeCompare(b.titulo));
                document.getElementById('texto-orden').innerText = "Alfabético";
                document.getElementById('icono-orden').className = "fa-solid fa-arrow-down-a-z text-xs";
            } else {
                filtrados.sort((a, b) => a.precioNum - b.precioNum);
                document.getElementById('texto-orden').innerText = "Menor precio";
                document.getElementById('icono-orden').className = "fa-solid fa-arrow-up-1-9 text-xs";
            }

            document.getElementById('contador-titulos').innerText = filtrados.length + (filtrados.length === 1 ? " título" : " títulos");

            filtrados.forEach(libro => {
                contenedor.innerHTML += `
                    <div class="flex space-x-4">
                        <a href="libro.html?id=${libro.id}" class="flex-shrink-0">
                            <img src="${libro.portada}" class="w-20 h-32 object-cover rounded-md shadow-md" alt="${libro.titulo}" onerror="this.src='https://via.placeholder.com/120x180/E5E7EB/9CA3AF?text=Portada'">
                        </a>
                        <div class="flex flex-col justify-between py-1 w-full">
                            <a href="libro.html?id=${libro.id}">
                                <p class="text-xs text-gray-500 font-medium mb-1">${libro.autor}</p>
                                <h3 class="text-base font-bold text-gray-900 leading-tight">${libro.titulo}</h3>
                            </a>
                            <div class="flex items-center justify-between mt-auto">
                                <span class="text-lg font-bold text-gray-900">${libro.precioTexto}</span>
                                <button onclick="anadirAlCarrito(this)" class="bg-black text-white text-xs font-bold py-2 px-3 rounded-lg flex items-center space-x-1.5 active:bg-gray-800 transition-colors">
                                    <i class="fa-solid fa-cart-shopping"></i>
                                    <span>Añadir al carrito</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function cambiarOrden() {
            if (ordenActual === 'populares') {
                ordenActual = 'alfabetico';
            } else if (ordenActual === 'alfabetico') {
                ordenActual = 'precio';
            } else {
                ordenActual = 'populares';
            }
            renderizarLibros();
        }

        function anadirAlCarrito(boton) {
            const contenidoOriginal = boton.innerHTML;
            boton.innerHTML = `<i class="fa-solid fa-check"></i><span>Añadido</span>`;
            boton.classList.remove('bg-black');
            boton.classList.add('bg-emerald-700');
            setTimeout(() => {
                boton.innerHTML = contenidoOriginal;
                boton.classList.remove('bg-emerald-700');
                boton.classList.add('bg-black');
            }, 1200);
        }

        renderizarLibros();
    </script>
</body>
</html>
