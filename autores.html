<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTrack - Lista de Autores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .mobile-container { width: 100%; max-width: 400px; height: 100vh; max-height: 850px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="accesibilidad.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="mobile-container bg-white shadow-2xl relative flex flex-col sm:rounded-[2.5rem] sm:h-[800px] sm:border-[8px] sm:border-gray-900 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-white pt-5 pb-2 px-4 z-10 sticky top-0">
            <div class="flex justify-between items-center mb-4 text-sm font-bold">
                <span>9:41</span>
                <div class="flex space-x-2 items-center">
                    <i class="fa-solid fa-signal text-xs"></i>
                    <i class="fa-solid fa-wifi text-xs"></i>
                    <i class="fa-solid fa-battery-full text-lg"></i>
                </div>
            </div>

            <!-- Navegación Superior -->
            <div class="flex items-center relative py-2">
                <button onclick="window.history.back()" class="absolute left-0 text-gray-900 text-xl px-2 active:scale-95 transition-transform">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h1 class="w-full text-center text-lg font-bold text-gray-900">Autores</h1>
            </div>
        </div>

        <!-- Contenido Central -->
        <div class="flex-1 overflow-y-auto no-scrollbar pb-24 px-4 pt-2">
            
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
                <input id="buscador-autores" type="text" oninput="renderizarAutores()" placeholder="Buscar autores" class="w-full bg-gray-100 text-gray-900 rounded-xl py-2.5 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-gray-300 text-sm font-medium">
            </div>

            <!-- Cabecera de resultados y botón de ordenar -->
            <div class="flex justify-between items-center mb-4">
                <span id="contador-autores" class="text-sm text-gray-500 font-medium">4 autores</span>
                
                <button onclick="cambiarOrden()" class="flex items-center space-x-1 border border-gray-200 px-3 py-1.5 rounded-lg text-sm font-semibold text-gray-900 hover:bg-gray-50 active:bg-gray-100 transition-colors">
                    <i id="icono-orden" class="fa-solid fa-list text-xs"></i>
                    <span id="texto-orden">Más populares</span>
                </button>
            </div>

            <!-- Contenedor de la lista -->
            <div id="lista-autores" class="flex flex-col space-y-3"></div>
            
        </div>

        <!-- Barra de Navegación Inferior -->
        <div class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex flex-col z-20">
            <div class="flex justify-between items-center px-6 py-3">
                <a href="inicio.html" class="text-gray-800 text-2xl flex flex-col items-center"><i class="fa-solid fa-house"></i></a>
                <a href="subastas.html" class="text-gray-800 text-2xl flex flex-col items-center"><i class="fa-solid fa-gavel"></i></a>
                <a href="escaner.html" class="text-gray-800 text-3xl flex flex-col items-center">
                    <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M4 4h4v2H6v2H4V4zm16 0h-4v2h2v2h2V4zM4 20h4v-2H6v-2H4v4zm16 0h-4v-2h2v-2h2v4zM7 7h10v10H7V7zm2 2v6h6V9H9z"/></svg>
                </a>
                <a href="carrito.html" class="text-gray-800 text-2xl flex flex-col items-center"><i class="fa-solid fa-cart-shopping"></i></a>
                <a href="perfil.html" class="text-gray-800 text-2xl flex flex-col items-center"><i class="fa-regular fa-user"></i></a>
            </div>
            <div class="w-full flex justify-center pb-2 pt-1">
                <div class="w-32 h-1 bg-black rounded-full"></div>
            </div>
        </div>

    </div>

    <script>
        const autores = [
            { id: "george", nombre: "George R.R. Martin", genero: "Fantasía épica", img: "img/george.jpg", popularidad: 100 },
            { id: "suzanne", nombre: "Suzanne Collins", genero: "Distopía · Literatura juvenil", img: "img/suzanne.jpg", popularidad: 90 },
            { id: "brandon", nombre: "Brandon Sanderson", genero: "Fantasía épica", img: "img/brandon.jpg", popularidad: 80 },
            { id: "cassandra", nombre: "Cassandra Clare", genero: "Fantasía · Literatura juvenil", img: "img/cassandra.jpg", popularidad: 70 }
        ];

        if (localStorage.getItem('bibliotrack_seguidos') === null) {
            localStorage.setItem('bibliotrack_seguidos', JSON.stringify(['george', 'brandon']));
        }

        let ordenActual = 'populares';

        function toggleSeguirLista(id) {
            let seguidos = JSON.parse(localStorage.getItem('bibliotrack_seguidos') || '[]');
            if (seguidos.includes(id)) {
                seguidos = seguidos.filter(item => item !== id);
            } else {
                seguidos.push(id);
            }
            localStorage.setItem('bibliotrack_seguidos', JSON.stringify(seguidos));
            renderizarAutores();
        }

        function renderizarAutores() {
            const contenedor = document.getElementById('lista-autores');
            const consulta = document.getElementById('buscador-autores').value.toLowerCase().trim();
            const seguidos = JSON.parse(localStorage.getItem('bibliotrack_seguidos') || '[]');
            contenedor.innerHTML = "";

            let autoresOrdenados = autores.filter(a =>
                a.nombre.toLowerCase().includes(consulta) || a.genero.toLowerCase().includes(consulta)
            );

            if (ordenActual === 'populares') {
                autoresOrdenados.sort((a, b) => b.popularidad - a.popularidad);
                document.getElementById('texto-orden').innerText = "Más populares";
                document.getElementById('icono-orden').className = "fa-solid fa-list text-xs";
            } else {
                autoresOrdenados.sort((a, b) => a.nombre.localeCompare(b.nombre));
                document.getElementById('texto-orden').innerText = "Alfabético";
                document.getElementById('icono-orden').className = "fa-solid fa-arrow-down-a-z text-xs";
            }

            document.getElementById('contador-autores').innerText = autoresOrdenados.length + (autoresOrdenados.length === 1 ? " autor" : " autores");

            autoresOrdenados.forEach(autor => {
                const estaSeguido = seguidos.includes(autor.id);
                const claseBtn = estaSeguido
                    ? "border border-gray-300 bg-white text-gray-900 hover:bg-gray-50"
                    : "border border-black bg-black text-white hover:bg-gray-800";
                const textoBtn = estaSeguido ? "Siguiendo" : "+ Seguir";

                contenedor.innerHTML += `
                    <div class="flex items-center justify-between p-2 rounded-xl hover:bg-gray-50 transition-colors">
                        <a href="autor.html?id=${autor.id}" class="flex items-center space-x-3.5 flex-1 min-w-0">
                            <img src="${autor.img}" class="w-14 h-14 rounded-full object-cover border border-gray-200 shadow-sm flex-shrink-0" alt="${autor.nombre}" onerror="this.src='https://via.placeholder.com/56x56/E5E7EB/9CA3AF'">
                            <div class="min-w-0 pr-2">
                                <h3 class="text-base font-bold text-gray-900 leading-tight truncate">${autor.nombre}</h3>
                                <p class="text-xs text-gray-500 font-medium mt-1 truncate">${autor.genero}</p>
                            </div>
                        </a>
                        <button onclick="toggleSeguirLista('${autor.id}')" type="button"
                                class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95 flex-shrink-0 ${claseBtn}">
                            ${textoBtn}
                        </button>
                    </div>
                `;
            });
        }

        function cambiarOrden() {
            ordenActual = (ordenActual === 'populares') ? 'alfabetico' : 'populares';
            renderizarAutores();
        }

        renderizarAutores();
    </script>
</body>
</html>
