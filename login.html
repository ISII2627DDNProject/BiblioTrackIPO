<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioTrack - Iniciar Sesión</title>
    <!-- Cargamos Tailwind CSS para los estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cargamos iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Tipografía similar a la del prototipo */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .mobile-container { width: 100%; max-width: 400px; height: 100vh; max-height: 850px; }
    </style>
    <script src="accesibilidad.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Contenedor simulando la pantalla del móvil -->
    <div class="mobile-container bg-white shadow-2xl relative overflow-hidden flex flex-col px-6 py-8 sm:rounded-[2rem] sm:h-[800px] sm:border-[8px] sm:border-gray-900">
        
        <!-- Barra de estado superior (Simulada) -->
        <div class="flex justify-between items-center mb-10 text-sm font-semibold">
            <span>9:41</span>
            <div class="flex space-x-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Título principal -->
        <h1 class="text-3xl font-bold text-gray-900 mb-2">BiblioTrack</h1>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Iniciar sesión</h2>
        <p class="text-gray-500 text-sm mb-8 leading-relaxed">
            Ingresa tu correo y contraseña para acceder a tu cuenta de BiblioTrack
        </p>

        <!-- Formulario -->
        <form class="flex flex-col space-y-4 mb-6">
            <div>
                <input type="email" placeholder="email@domain.com" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent">
            </div>
            <div>
                <input type="password" placeholder="Contraseña" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent">
            </div>
            
            <button type="button" onclick="window.location.href='inicio.html'" class="w-full bg-gray-900 text-white font-semibold py-3.5 rounded-xl hover:bg-black transition-colors mt-2">
                Iniciar sesión
            </button>
        </form>

        <!-- Botones sociales -->
        <div class="flex flex-col space-y-3 mb-auto">
            <button type="button" onclick="window.location.href='inicio.html'" class="w-full flex items-center justify-center space-x-2 border border-gray-300 font-semibold py-3.5 rounded-xl hover:bg-gray-50 transition-colors">
                <!-- SVG de Google incrustado -->
                <svg class="w-5 h-5" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.7 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Continuar con Google</span>
            </button>
            <button type="button" onclick="window.location.href='inicio.html'" class="w-full flex items-center justify-center space-x-2 border border-gray-300 font-semibold py-3.5 rounded-xl hover:bg-gray-50 transition-colors">
                <i class="fa-brands fa-apple text-xl"></i>
                <span>Continuar con Apple</span>
            </button>
        </div>

        <!-- Footer legal -->
        <div class="mt-8 text-center px-4">
            <p class="text-xs text-gray-400 leading-relaxed">
                Al hacer clic en continuar, aceptas nuestros Términos de Servicio y nuestra Política de Privacidad
            </p>
        </div>

    </div>

</body>
</html>
